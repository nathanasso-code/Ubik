name: Ubik Ukraine v5.1 judges (Sonnet and DeepSeek V4.1 Flash, frozen pairs)
on:
  # Runs only on request: never on ordinary code pushes.
  push:
    branches: [main]
    paths: [runs/ukraine-v51-judges.request]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  judges:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen prompts and inputs before any paid call
        run: |
          echo "703e308ae07b5e1c500674b6238dbe0248a5cdef0598921cd7beb8a5299d686f  prompts/v5.1/pair_judge.txt" | sha256sum -c -
          grep -E "ukraine-v51-(extraction|candidate-pairs|blind-mapping)" docs/experiment-results/v5.1/SHA256SUMS | sha256sum -c -
          python -m py_compile ingestion/ubik_ukraine_v51_judge.py
      - name: Judge with Sonnet 5.5
        env:
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m ingestion.ubik_ukraine_v51_judge sonnet
      - name: Judge with DeepSeek V4.1 Flash (Nebius FP8)
        if: always()
        env:
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m ingestion.ubik_ukraine_v51_judge deepseek
      - name: Commit complete or partial outputs
        if: always()
        run: |
          for f in docs/experiment-results/v5.1/ukraine-v51-judge-sonnet.json docs/experiment-results/v5.1/ukraine-v51-judge-deepseek.json; do
            if [ -f "$f" ]; then sha256sum "$f" >> docs/experiment-results/v5.1/SHA256SUMS; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/experiment-results/v5.1
          git diff --cached --quiet || (git commit -m "Publish v5.1 judge outputs (unadjudicated)" && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukraine-v51-judges
          path: docs/experiment-results/v5.1/ukraine-v51-judge-*.json
