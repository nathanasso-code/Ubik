name: Groq connection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Groq API connectivity without inference
        env:
          GROQ_API_KEY: ${{ secrets.UBIK_LLM_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          key=os.environ.get("GROQ_API_KEY","").strip()
          if not key:
              sys.exit("Missing UBIK_LLM_API_KEY secret")
          req=urllib.request.Request(
              "https://api.groq.com/openai/v1/models",
              headers={"Authorization":"Bearer "+key,"Accept":"application/json","User-Agent":"Ubik-Groq-Diagnostic/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  payload=json.load(response)
                  models={x.get("id") for x in payload.get("data",[]) if isinstance(x,dict)}
                  print("Groq models endpoint HTTP:",response.status)
                  print("Configured model available:", "llama-3.3-70b-versatile" in models)
                  print("Available model IDs:", ", ".join(sorted(models)))
                  model="openai/gpt-oss-120b"
                  if model not in models:
                      sys.exit("Target model not available")
                  inference=json.dumps({"model":model,"messages":[{"role":"user","content":"Reply with exactly OK."}],"max_completion_tokens":64}).encode()
                  test=urllib.request.Request("https://api.groq.com/openai/v1/chat/completions",
                      data=inference,headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
                  try:
                      with urllib.request.urlopen(test,timeout=30) as check:
                          answer=json.load(check)
                          print("Minimal inference HTTP:",check.status)
                          print("Inference returned choices:",bool(answer.get("choices")))
                  except urllib.error.HTTPError as exc:
                      print("Minimal inference HTTP:",exc.code)
                      try:
                          err=json.loads(exc.read(4096).decode()).get("error",{})
                          code=err.get("code") if isinstance(err,dict) else None
                          if isinstance(code,(str,int)) and len(str(code))<80:
                              import re
                              if re.fullmatch(r"[A-Za-z0-9_.-]+",str(code)):print("Inference provider error code:",code)
                      except (ValueError,UnicodeError,TypeError):
                          pass
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print("Groq models endpoint HTTP:",exc.code)
              try:
                  payload=json.loads(exc.read(4096).decode())
                  error=payload.get("error",{})
                  code=error.get("code") if isinstance(error,dict) else None
                  if isinstance(code,(str,int)) and len(str(code))<80:
                      import re
                      if re.fullmatch(r"[A-Za-z0-9_.-]+",str(code)):
                          print("Provider error code:",code)
              except (ValueError,UnicodeError,TypeError):
                  pass
              sys.exit(1)
          except urllib.error.URLError as exc:
              print("Connection failed:",type(exc).__name__)
              sys.exit(1)
          PY
