name: Ubik Ukraine v5 zero-cost recomposition (multi-membership)
on:
  push:
    branches: [experiment/taxonomy-fewshot-pilot]
    paths: [.github/workflows/ukraine-v5-zero-cost-recompose.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recompose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/taxonomy-fewshot-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore immutable v5 judgment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/ukraine-v5
          gh api repos/nathanasso-code/Ubik/actions/artifacts/12725256478/zip > /tmp/judge.zip
          unzip -p /tmp/judge.zip v5-judge.json > data/ukraine-v5/v5-judge.json
      - name: Recompose without any API keys
        run: python -m ingestion.ubik_ukraine_v5_recompose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukraine-v5-zero-cost-recomposed
          path: data/ukraine-v5/v5-recomposed.json
