name: Ubik Mastodon AI discovery 20
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    env:
      UBIK_MASTODON_TOKEN: ${{ secrets.UBIK_MASTODON_TOKEN }}
    steps:
      - name: Discover unique public AI contributions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          token = os.environ.get("UBIK_MASTODON_TOKEN")
          if not token:
              raise SystemExit("Missing UBIK_MASTODON_TOKEN")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          tags = ["ai", "artificialintelligence", "machinelearning", "llm", "generativeai", "openai", "aisafety", "aiethics"]
          found, checks, errors = {}, [], []
          for tag in tags:
              max_id = None
              for page in range(2):
                  params = {"limit": 40}
                  if max_id:
                      params["max_id"] = max_id
                  url = "https://mastodon.social/api/v1/timelines/tag/" + tag + "?" + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers={"Accept":"application/json", "Authorization":"Bearer "+token, "User-Agent":"Ubik-research/0.1"})
                  try:
                      with opener.open(req, timeout=15) as response:
                          statuses = json.load(response)
                  except Exception as exc:
                      errors.append({"tag":tag,"page":page+1,"error":type(exc).__name__,"http_status":getattr(exc,"code",None)})
                      break
                  checks.append({"tag":tag,"page":page+1,"received":len(statuses)})
                  for s in statuses:
                      if s.get("visibility") != "public" or s.get("reblog") or not s.get("url"):
                          continue
                      key = s.get("uri") or s["url"]
                      if key not in found:
                          found[key] = {"uri":key,"url":s["url"],"author":s.get("account",{}).get("acct"),"author_url":s.get("account",{}).get("url"),"published_at":s.get("created_at"),"language":s.get("language"),"content_html":s.get("content",""),"tags":[t.get("name") for t in s.get("tags",[]) if isinstance(t,dict)],"discovered_by":[tag]}
                      elif tag not in found[key]["discovered_by"]:
                          found[key]["discovered_by"].append(tag)
                  if not statuses or not statuses[-1].get("id"):
                      break
                  max_id = statuses[-1]["id"]
                  time.sleep(0.5)
          output = {"source":"mastodon.social official API","unique_count":len(found),"records":list(found.values()),"checks":checks,"errors":errors,"editorial_validation":"not_assessed","coverage":"instance-visible public posts only"}
          Path("mastodon-ai-research.json").write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"unique_count":len(found),"checks":checks,"errors":errors,"sample_urls":[v["url"] for v in list(found.values())[:25]]},ensure_ascii=False))
          if len(found) < 20:
              raise SystemExit("Fewer than 20 unique public posts; inspect research artifact")
          PY
      - name: Upload research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastodon-ai-research
          path: mastodon-ai-research.json
          retention-days: 3
          if-no-files-found: warn
