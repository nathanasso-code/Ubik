name: Ubik Experiment Runner
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment to run from develop/ubik-core"
        required: true
        type: choice
        options:
          - neural-embedding-cards
          - grounded-global-cards
permissions:
  contents: read
  actions: read
concurrency:
  group: ubik-experiment-${{ inputs.experiment }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen input artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          mkdir -p data/runner
          if [ "$EXPERIMENT" = "neural-embedding-cards" ]; then
            gh run download 39822649930 --name grounded-global-news-cards --dir data/runner
          elif [ "$EXPERIMENT" = "grounded-global-cards" ]; then
            gh run download 39075100154 --name frozen-neural-expanded-candidates --dir data/runner
            gh run download 39076957811 --name hybrid-qwen-adjudication-pilot --dir data/runner
            gh run download 39107689997 --name frozen-original-texts-pilot --dir data/runner
          else
            echo "Unknown experiment"; exit 1
          fi
      - name: Execute selected experiment
        env:
          EXPERIMENT: ${{ inputs.experiment }}
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: deepseek/deepseek-v3.2
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "$EXPERIMENT" = "neural-embedding-cards" ]; then
            pip install sentence-transformers scikit-learn
            python -m ingestion.frozen_neural_embedding_cards data/runner/result.json --output data/runner/experiment-result.json
          elif [ "$EXPERIMENT" = "grounded-global-cards" ]; then
            python -m ingestion.frozen_deepseek_grounded_global data/runner/neural-expanded-candidates.json data/runner/hybrid-qwen-review.json data/runner/original-texts.json --output data/runner/experiment-result.json
          fi
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-experiment-${{ inputs.experiment }}
          path: data/runner/experiment-result.json
