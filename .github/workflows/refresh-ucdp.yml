name: Refresh UCDP corpus
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_ucdp.py
      - run: |
          git config user.name "ubik-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ucdp
          git diff --cached --quiet || git commit -m "data: refresh UCDP Ukraine corpus"
          git push
