name: Refresh UCDP corpus
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Run an Ubik experiment instead of refreshing UCDP'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'neural-embedding-cards'
          - 'two-track-deepseek'
          - 'qwen-passages-deepseek-cards'
          - 'deepseek-passages-deepseek-cards'
          - 'conservative-vs-audit'
  schedule:
    - cron: "17 5 * * 2"
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name == 'schedule' || inputs.experiment == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_ucdp.py
      - run: python scripts/classify_ucdp.py
      - run: python scripts/build_attack_corpus.py
      - run: |
          git config user.name "ubik-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ucdp data/ukraine-attacks-derived.json
          git diff --cached --quiet || git commit -m "data: refresh UCDP Ukraine corpus"
          git push
  neural_embedding:
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'neural-embedding-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install embedding dependencies
        run: python -m pip install sentence-transformers scikit-learn
      - name: Download frozen DeepSeek result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/neural-cards
          gh run download 39822649930 --name grounded-global-news-cards --dir data/neural-cards
      - name: Neural clustering on existing 105 news
        run: python -m ingestion.frozen_neural_embedding_cards data/neural-cards/result.json --output data/neural-cards/embedding-cards.json
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-embedding-cards
          path: data/neural-cards/embedding-cards.json
  two_track_deepseek:
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'two-track-deepseek'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install embeddings
        run: python -m pip install sentence-transformers scikit-learn
      - name: Download frozen texts and grounded news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/two-track
          gh run download 39822649930 --name grounded-global-news-cards --dir data/two-track
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/two-track
      - name: Compare summary and source-text embeddings with DeepSeek review
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: deepseek/deepseek-v3.2
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m ingestion.frozen_two_track_deepseek_cards data/two-track/result.json data/two-track/original-texts.json --output data/two-track/two-track-results.json --max-review 50
      - name: Upload partial or completed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-track-deepseek-results
          path: data/two-track/two-track-results.json
  qwen_passages_deepseek_cards:
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'qwen-passages-deepseek-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sentence-transformers scikit-learn
      - name: Download frozen benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/qwen-evidence
          gh run download 39822649930 --name grounded-global-news-cards --dir data/qwen-evidence
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/qwen-evidence
      - name: Compare Qwen passage evidence and DeepSeek card grouping
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: deepseek/deepseek-v3.2
          UBIK_QWEN_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m ingestion.frozen_qwen_passages_two_track data/qwen-evidence/result.json data/qwen-evidence/original-texts.json --output data/qwen-evidence/results.json --max-review 50
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-passages-deepseek-cards-results
          path: data/qwen-evidence/results.json

  deepseek_passages_deepseek_cards:
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'deepseek-passages-deepseek-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sentence-transformers scikit-learn
      - name: Download same frozen benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/deepseek-evidence
          gh run download 39822649930 --name grounded-global-news-cards --dir data/deepseek-evidence
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/deepseek-evidence
      - name: Compare summary and DeepSeek-selected verified passages
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: deepseek/deepseek-v3.2
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m ingestion.frozen_deepseek_passages_two_track data/deepseek-evidence/result.json data/deepseek-evidence/original-texts.json --output data/deepseek-evidence/results.json --max-review 50
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-evidence-two-track-results
          path: data/deepseek-evidence/results.json

  conservative_vs_audit:
    if: github.event_name == 'workflow_dispatch' && inputs.experiment == 'conservative-vs-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install sentence-transformers scikit-learn
      - name: Download frozen benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/conservative-audit
          gh run download 39822649930 --name grounded-global-news-cards --dir data/conservative-audit
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/conservative-audit
      - name: Run paired arms on same extracted evidence
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: deepseek/deepseek-v3.2
          UBIK_QWEN_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m ingestion.frozen_conservative_vs_audit data/conservative-audit/result.json data/conservative-audit/original-texts.json --output data/conservative-audit/paired-results.json --max-review 50
      - name: Publish both arms and audit decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservative-vs-audit-results
          path: data/conservative-audit/*.json
