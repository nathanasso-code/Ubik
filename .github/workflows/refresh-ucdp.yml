name: Refresh UCDP Ukraine attacks corpus
on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_ucdp.py
      - run: python scripts/classify_ucdp.py
      - run: python scripts/build_attack_corpus.py
      - name: Commit only manifests and the derived corpus used by the map
        run: |
          git config user.name "ubik-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ucdp/*manifest.json data/ukraine-attacks-derived.json
          git diff --cached --quiet || git commit -m "data: refresh UCDP Ukraine corpus"
          git push
