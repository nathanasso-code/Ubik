name: Open text corpus empirical experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open-text-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate corpus parser and end-to-end baseline
        run: |
          python -m unittest discover -s tests -p 'test_open_corpus_experiment.py'
          python -m unittest discover -s tests -p 'test_open_corpus_event_guard.py'
      - name: Acquire up to 120 full-text Wikinews articles through public API
        run: python -m ingestion.open_text_corpus --limit 120 --output data/discovery/open-text-corpus-private.json
      - name: Run claim extraction, comparison candidates, synthesis and categorization
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path("data/discovery/open-text-corpus-private.json").read_text())
          if data.get("acquired",0)<1:
              print("No source bodies acquired; preserving rate-limit outcome without generating misleading empty-card metrics.")
              sys.exit(0)
          PY
          if python - <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path('data/discovery/open-text-corpus-private.json').read_text())
          sys.exit(0 if data.get('acquired',0)>0 else 1)
          PY
          then
            python -m ingestion.open_corpus_analysis data/discovery/open-text-corpus-private.json --output data/discovery/open-text-analysis-private.json
          fi
      - name: Export privacy- and rights-conscious metrics and card summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("data/discovery/open-text-analysis-private.json")
          if not source.exists():
              print('No corpus analysis generated: source API unavailable or rate-limited; see acquisition status')
              raise SystemExit(0)
          d=json.loads(source.read_text())
          report={k:v for k,v in d.items() if k not in ("claim_candidates",)}
          for card in report["cards"]:
              card.pop("claim_candidates",None)
          out=Path("data/discovery/open-text-experiment-report.json")
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          from collections import Counter
          print(json.dumps({"documents":d["documents_acquired"],"claim_candidates":d["claim_candidate_count"],"candidate_clusters":d["multi_source_candidate_clusters"],"cards":len(d["cards"]),"categories":dict(Counter(x["category"] for x in d["cards"])),"candidate_multi_document_cards":[{"title":x["title"],"sources":x["source_urls"]} for x in d["cards"] if x["source_count"]>1][:10],"example_titles":[x["title"] for x in d["cards"][:12]]},ensure_ascii=False))
          PY
      - name: Preserve metrics and source-linked review cards, not full article bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-text-experiment-report
          path: data/discovery/open-text-experiment-report.json
          if-no-files-found: warn
          retention-days: 14
