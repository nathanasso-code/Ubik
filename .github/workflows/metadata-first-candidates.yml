name: Metadata-first corpus candidate pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/metadata_first_candidates.py'
      - '.github/workflows/metadata-first-candidates.yml'
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recollect heterogeneous RSS source metadata
        run: |
          python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/metadata-rss.json
      - name: Retrieve conservative review candidates without LLM
        run: |
          python -m ingestion.metadata_first_candidates data/discovery/metadata-rss.json --output data/discovery/metadata-first-candidates.json
      - name: Publish reproducible artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-first-corpus-candidates
          path: |
            data/discovery/metadata-rss.json
            data/discovery/metadata-first-candidates.json
          if-no-files-found: warn
