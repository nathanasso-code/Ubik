name: Ubik relational experiment - one_difference
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/frozen_qwen_relational_variants.py'
      - '.github/workflows/ubik-relational-one_difference.yml'
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/relational
          gh run download 39315292356 --name identity-comparison-identity --dir data/relational
      - name: Run one_difference variant
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_relational_variants data/relational/result-identity.json --variant one_difference --output data/relational/result-one_difference.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-one_difference-results
          path: data/relational/result-one_difference.json
