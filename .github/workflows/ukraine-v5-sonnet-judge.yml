name: Ubik Ukraine v5 Sonnet controlled judge
on:
  push:
    branches: [experiment/taxonomy-fewshot-pilot]
    paths: [.github/workflows/ukraine-v5-sonnet-judge.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/taxonomy-fewshot-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified Sonnet extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/ukraine-v5
          gh api repos/nathanasso-code/Ubik/actions/artifacts/12719538526/zip > /tmp/extraction.zip
          unzip -p /tmp/extraction.zip v5-extraction.json > data/ukraine-v5/v5-extraction.json
      - name: Install frozen E5 retrieval
        run: pip install sentence-transformers==3.4.1
      - name: Judge with Sonnet 5.5, compose and diagnose bridges
        env:
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UBIK_LLM_MODEL: anthropic/claude-sonnet-5.5
        run: python -m ingestion.ubik_ukraine_v5_judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukraine-v5-sonnet-judge
          path: data/ukraine-v5/v5-judge.json
