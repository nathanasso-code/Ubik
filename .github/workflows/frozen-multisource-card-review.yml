name: Frozen multi-source card review
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/multisource_card_review.py'
      - '.github/workflows/frozen-multisource-card-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Download EXACT original 54-pair report (not a refreshed RSS snapshot)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/discovery/frozen
          gh run download 39017110794 --repo "${{ github.repository }}" --name semantic-llm-relationships --dir data/discovery/frozen
          test -s data/discovery/frozen/semantic-llm-relationships.json
      - name: Jointly adjudicate multi-source groups and propose tags
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$UBIK_LLM_API_KEY" ]; then echo 'Missing OPENROUTER_API_KEY'; exit 1; fi
          python -m ingestion.multisource_card_review data/discovery/frozen/semantic-llm-relationships.json --output data/discovery/frozen/multisource-card-review.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-multisource-card-review
          path: data/discovery/frozen/multisource-card-review.json
          if-no-files-found: warn
