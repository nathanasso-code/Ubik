name: OpenRouter free API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify free-model inference with a single bounded request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          key=os.environ.get("OPENROUTER_API_KEY","").strip()
          if not key:
              sys.exit("Missing OPENROUTER_API_KEY repository secret")
          base="https://openrouter.ai/api/v1"
          headers={"Authorization":"Bearer "+key,"Accept":"application/json","User-Agent":"Ubik-OpenRouter-Smoke/1.0"}
          req=urllib.request.Request(base+"/models",headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  catalog=json.load(response).get("data",[])
                  print("Catalog HTTP:",response.status)
          except urllib.error.HTTPError as exc:
              print("Catalog HTTP:",exc.code)
              sys.exit(1)
          free=[m for m in catalog if isinstance(m,dict) and str(m.get("id","")).endswith(":free") and "text" in m.get("architecture",{}).get("input_modalities",["text"]) and "text" in m.get("architecture",{}).get("output_modalities",["text"])]
          if not free:
              sys.exit("No suitable free text models in catalog")
          free.sort(key=lambda m:(0 if "qwen" in m.get("id","").lower() else 1,m.get("id","")))
          model=free[0]["id"]
          print("Selected free model:",model)
          payload=json.dumps({"model":model,"messages":[{"role":"user","content":"Reply with exactly OK."}],"max_tokens":24,"temperature":0}).encode()
          request=urllib.request.Request(base+"/chat/completions",data=payload,method="POST",headers={**headers,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(request,timeout=40) as response:
                  result=json.load(response)
                  print("Inference HTTP:",response.status)
                  print("Choices returned:",len(result.get("choices",[])))
                  print("Usage:",json.dumps(result.get("usage",{})))
                  if not result.get("choices"):
                      sys.exit("No model response")
          except urllib.error.HTTPError as exc:
              print("Inference HTTP:",exc.code)
              try:
                  body=json.load(exc)
                  error=body.get("error",{})
                  print("Error code:",str(error.get("code","unknown"))[:60])
                  print("Error message:",str(error.get("message","unknown"))[:240])
              except (ValueError,TypeError):
                  print("Non-JSON error response")
              sys.exit(1)
          PY
