name: Metadata-first Qwen group adjudication
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/metadata_group_adjudication.py'
      - '.github/workflows/metadata-group-adjudication.yml'
permissions:
  contents: read
  actions: read
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen metadata candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/discovery/metadata
          gh run download 39052746507 --repo "${{ github.repository }}" --name metadata-first-corpus-candidates --dir data/discovery/metadata
      - name: Qwen metadata-first review (bounded)
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -m ingestion.metadata_group_adjudication data/discovery/metadata/metadata-first-candidates.json --max-calls 12 --output data/discovery/metadata-group-review.json
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-first-qwen-groups
          path: |
            data/discovery/metadata-group-review.json
            data/discovery/metadata-group-review.checkpoint.json
          if-no-files-found: warn
