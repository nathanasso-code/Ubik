name: Whole-group semantic card review
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/whole_group_card_review.py'
      - '.github/workflows/whole-group-card-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Download frozen input artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/discovery/frozen/{pairs,topics,strict}
          gh run download 39017110794 --repo "${{ github.repository }}" --name semantic-llm-relationships --dir data/discovery/frozen/pairs
          gh run download 39026959251 --repo "${{ github.repository }}" --name full-corpus-topic-grouping --dir data/discovery/frozen/topics
          gh run download 39033053708 --repo "${{ github.repository }}" --name strict-cards-preserved-topics --dir data/discovery/frozen/strict
      - name: Discover and critically review whole-source groups
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -m ingestion.whole_group_card_review data/discovery/frozen/pairs/semantic-llm-relationships.json data/discovery/frozen/topics/full-corpus-topic-grouping.json data/discovery/frozen/strict/strict-cards-preserved-topics.json --output data/discovery/frozen/whole-group-card-review.json
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-group-card-review
          path: data/discovery/frozen/whole-group-card-review.json
          if-no-files-found: warn
