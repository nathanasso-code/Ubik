name: Ubik two-pass differential benchmark
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths: ['.github/workflows/ubik-two-pass-differential.yml', 'ingestion/frozen_qwen_two_pass_differential.py']
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/two-pass
          gh run download 39075100154 --name frozen-neural-expanded-candidates --dir data/two-pass
          gh run download 39076957811 --name hybrid-qwen-adjudication-pilot --dir data/two-pass
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/two-pass
      - name: Two-pass differential
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_two_pass_differential data/two-pass/neural-expanded-candidates.json data/two-pass/hybrid-qwen-review.json data/two-pass/original-texts.json --output data/two-pass/result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-pass-differential-results
          path: data/two-pass/result.json
