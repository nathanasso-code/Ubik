name: AI sources discovery pilot
on:
  push:
    branches:
      - develop/ubik-core
    paths:
      - 'scripts/discover_ai_sources.py'
      - 'config/source-registry.ai-models.json'
      - 'tests/test_discover_ai_sources.py'
      - '.github/workflows/ai-discovery-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover RSS and Atom metadata
        run: python scripts/discover_ai_sources.py
      - name: Build auditable coverage report
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/report_ai_discovery.py data/discovery/ai-models.json data/discovery/report.md; fi
      - name: Summarize coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/discovery/ai-models.json")
          if p.exists():
              data = json.loads(p.read_text())
              coverage = data.get("coverage", {})
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("## AI source discovery coverage\\n\\n")
                  for key, value in coverage.items():
                      out.write(f"- **{key}**: {value}\\n")
                  out.write("\\n### Feed status\\n\\n")
                  for source in data.get("source_reports", []):
                      out.write(f"- {source['source_id']}: {source['status']}, {source.get('seen', 0)} seen, {source.get('new', 0)} new\\n")
          PY
      - name: Upload discovery artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-discovery
          path: data/discovery/
          retention-days: 14
