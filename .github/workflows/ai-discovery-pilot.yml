name: AI sources discovery pilot
on:
  push:
    branches:
      - develop/ubik-core
    paths:
      - 'scripts/discover_ai_sources.py'
      - 'config/source-registry.ai-models.json'
      - 'tests/test_discover_ai_sources.py'
      - '.github/workflows/ai-discovery-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser tests
        run: python -m unittest discover -s tests -p 'test_discover_ai_sources.py'
      - name: Discover RSS and Atom metadata
        run: python scripts/discover_ai_sources.py
      - name: Upload discovery artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-discovery
          path: data/discovery/ai-models.json
          retention-days: 14
