name: AI sources discovery pilot
on:
  push:
    branches:
      - develop/ubik-core
    paths:
      - 'scripts/discover_ai_sources.py'
      - 'scripts/report_ai_discovery.py'
      - 'scripts/discover_ai_authors.py'
      - 'scripts/discover_social_authors.py'
      - 'scripts/discover_candidate_feeds.py'
      - 'scripts/review_ai_relevance.py'
      - 'scripts/summarize_discovery.py'
      - 'scripts/audit_article_attribution.py'
      - 'scripts/diagnose_source_coverage.py'
      - 'scripts/build_epistemic_review_queue.py'
      - 'scripts/build_epistemic_pair_queue.py'
      - 'config/italian-cross-disciplinary-candidates.json'
      - 'config/source-registry.ai-models.json'
      - 'tests/test_discover_ai_sources.py'
      - 'tests/test_report_ai_discovery.py'
      - 'tests/test_discover_ai_authors.py'
      - 'tests/test_discover_social_authors.py'
      - 'tests/test_discover_candidate_feeds.py'
      - 'tests/test_review_ai_relevance.py'
      - 'tests/test_audit_article_attribution.py'
      - 'tests/test_discovery_metadata_enrichment.py'
      - 'tests/test_diagnose_source_coverage.py'
      - 'tests/test_epistemic_review_queue.py'
      - 'tests/test_epistemic_pair_queue.py'
      - '.github/workflows/ai-discovery-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover RSS and Atom metadata
        run: |
          python scripts/discover_ai_sources.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path('data/discovery/ai-models.json').read_text())
          if data.get('coverage', {}).get('successful_feeds', 0) == 0:
              print('ERROR: No feeds successfully retrieved; discovery cannot be considered validated.')
              sys.exit(1)
          PY
      - name: Generate cross-disciplinary relevance review
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/review_ai_relevance.py data/discovery/ai-models.json data/discovery/ai-relevance-review.json; fi
      - name: Audit a bounded sample of missing article bylines
        if: always()
        continue-on-error: true
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/audit_article_attribution.py data/discovery/ai-models.json data/discovery/article-attribution-audit.json --limit 24; fi
      - name: Diagnose per-source coverage
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/diagnose_source_coverage.py data/discovery/ai-models.json data/discovery/ai-relevance-review.json data/discovery/source-coverage-diagnostics.json; fi
      - name: Prepare epistemic event review queue (unlabeled)
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/build_epistemic_review_queue.py data/discovery/ai-models.json data/discovery/epistemic-review-queue.json --per-source 3 --max-total 60; fi
      - name: Prepare unverified candidate event pairs
        if: always()
        run: |
          if test -f data/discovery/epistemic-review-queue.json; then python scripts/build_epistemic_pair_queue.py data/discovery/epistemic-review-queue.json data/discovery/epistemic-pair-review.json --limit 40; fi
      - name: Generate author candidate queue
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/discover_ai_authors.py data/discovery/ai-models.json data/discovery/ai-author-candidates.json; fi
      - name: Discover public Bluesky and Mastodon profiles (experimental)
        continue-on-error: true
        run: |
          python scripts/discover_social_authors.py \
            --query "artificial intelligence research" \
            --query "neuroscience" \
            --query "philosophy of mind" \
            --instance "https://mastodon.social" \
            --instance "https://fosstodon.org" \
            --output data/discovery/social-author-candidates.json
      - name: Discover feeds from Italian cross-disciplinary candidates
        continue-on-error: true
        run: |
          python scripts/discover_candidate_feeds.py \
            config/italian-cross-disciplinary-candidates.json \
            data/discovery/italian-feed-candidates.json
      - name: Build auditable coverage report
        if: always()
        run: |
          if test -f data/discovery/ai-models.json; then python scripts/report_ai_discovery.py data/discovery/ai-models.json data/discovery/report.md; fi
      - name: Summarize coverage
        if: always()
        run: |
          python scripts/summarize_discovery.py data/discovery >> "$GITHUB_STEP_SUMMARY"
          if test -f data/discovery/report.md; then cat data/discovery/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload discovery artifact for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-discovery
          path: data/discovery/
          retention-days: 14
