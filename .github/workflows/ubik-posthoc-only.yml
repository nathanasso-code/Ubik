name: Ubik saved Qwen TF-IDF embedding audit only
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/ubik-posthoc-only.yml'
permissions:
  contents: read
  actions: read
jobs:
  similarity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate TF-IDF tokenizer with tiny fixture
        run: |
          python -m pip install --quiet scikit-learn
          python - <<'PY'
          from sklearn.feature_extraction.text import TfidfVectorizer
          import inspect
          from ingestion import post_qwen_similarity_audit
          src=inspect.getsource(post_qwen_similarity_audit.audit)
          assert 'token_pattern=r"(?u)\\b\\w+\\b"' in src
          assert TfidfVectorizer(token_pattern=r"(?u)\b\w+\b").fit_transform(["test","another test"]).shape==(2,2)
          PY
      - name: Download saved Qwen results, no API calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/posthoc/baseline data/posthoc/v2
          gh run download 39117837512 --repo "${{ github.repository }}" --name ubik-single-call-ab-report --dir data/posthoc/baseline
          gh run download 39119315809 --repo "${{ github.repository }}" --name ubik-qwen-v2-posthoc-ab --dir data/posthoc/v2
      - name: Compute similarity only
        run: |
          python -m pip install --quiet sentence-transformers
          python -u -m ingestion.post_qwen_similarity_audit data/posthoc/baseline/text-qwen-review.json --output data/posthoc/baseline-similarity.json
          python -u -m ingestion.post_qwen_similarity_audit data/posthoc/v2/prompt-v2-review.json --output data/posthoc/v2-similarity.json
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-saved-qwen-posthoc-only
          path: |
            data/posthoc/baseline-similarity.json
            data/posthoc/v2-similarity.json
          if-no-files-found: warn
