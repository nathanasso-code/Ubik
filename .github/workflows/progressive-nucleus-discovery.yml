name: Progressive nucleus discovery pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/progressive_nucleus_expansion.py'
      - 'tests/test_progressive_nucleus_expansion.py'
      - '.github/workflows/progressive-nucleus-discovery.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test multi-anchor candidate discovery
        run: python -m unittest discover -s tests -p 'test_progressive_nucleus_expansion.py'
      - name: Mine current RSS candidates
        run: |
          python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/nucleus-rss.json
          python -m ingestion.cross_source_candidate_mining data/discovery/nucleus-rss.json --output data/discovery/nucleus-candidates.json
      - name: Demonstrate expansion from provisional high-ranked seed pair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ingestion.progressive_nucleus_expansion import expand
          data=json.loads(Path('data/discovery/nucleus-candidates.json').read_text())
          pairs=data['top_pairs']
          # Discovery demonstration ONLY: highest-ranked pair is not verified.
          seeds=[pairs[0]['left']['url'],pairs[0]['right']['url']] if pairs else []
          if len(seeds)<2:raise SystemExit('No seed candidates')
          result=expand(pairs,seeds)
          result['seed_verification']='UNVERIFIED DEMONSTRATION ONLY'
          result['corpus_documents']=data['documents']
          result['candidate_pairs_available']=len(pairs)
          Path('data/discovery/nucleus-expansion-demo.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('Progressive nucleus pilot:',json.dumps({'corpus_documents':data['documents'],'candidate_edges':len(pairs),'provisional_seed_count':len(seeds),'expansion_candidates':result['candidate_count'],'warning':result['seed_verification']}))
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: progressive-nucleus-demo
          path: data/discovery/nucleus-expansion-demo.json
