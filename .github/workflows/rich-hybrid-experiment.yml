name: Rich-text hybrid corpus experiment
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/mass_rich_hybrid_pilot.py'
      - '.github/workflows/rich-hybrid-experiment.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retrieval dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn
      - name: Acquire licensed substantial bodies and run Groq hybrid comparison
        env:
          UBIK_LLM_ENDPOINT: https://api.groq.com/openai/v1/chat/completions
          UBIK_LLM_MODEL: llama-3.3-70b-versatile
          UBIK_LLM_API_KEY: ${{ secrets.UBIK_LLM_API_KEY }}
        run: |
          if [ -z "$UBIK_LLM_API_KEY" ]; then echo 'Missing UBIK_LLM_API_KEY secret'; exit 1; fi
          python -m ingestion.mass_rich_hybrid_pilot \
            --texts data/discovery/hybrid-licensed-papers \
            --output data/discovery/mass-rich-hybrid-results.json \
            --per-topic 65 --max-acquire 100 --budget 40 --llm-limit 8 --execute
          python - <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path("data/discovery/mass-rich-hybrid-results.json").read_text())
          coverage=result["llm"]["coverage"]
          print("LLM experiment coverage:",json.dumps(coverage))
          for item in result["llm"]["results"]:
              if item["status"]=="analysis_error":
                  print("LLM request failed:",item.get("error_type"),"HTTP",item.get("http_status"))
          if coverage["analyzed"]==0:
              sys.exit("Experiment failed: no successful LLM inferences")
          PY
      - name: Publish reproducible experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rich-hybrid-corpus-results
          path: |
            data/discovery/mass-rich-hybrid-results.json
          if-no-files-found: warn
