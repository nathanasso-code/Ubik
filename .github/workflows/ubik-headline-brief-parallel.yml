name: Ubik fresh headline brief parallel benchmark
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/frozen_qwen_headline_brief.py'
      - '.github/workflows/ubik-headline-brief-parallel.yml'
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen original articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/headline
          gh run download 39075100154 --name frozen-neural-expanded-candidates --dir data/headline
          gh run download 39076957811 --name hybrid-qwen-adjudication-pilot --dir data/headline
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/headline
      - name: Extract fundamental news from each original source
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_headline_brief data/headline/neural-expanded-candidates.json data/headline/hybrid-qwen-review.json data/headline/original-texts.json --phase extract --output data/headline/extraction.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headline-brief-extraction
          path: data/headline/extraction.json
  compare:
    needs: extract
    if: needs.extract.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [semantic, one_difference, shared_two, differential_original, one_difference_strict]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: headline-brief-extraction
          path: data/headline
      - name: Compose variant
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_headline_brief data/headline/extraction.json data/headline/extraction.json data/headline/extraction.json --phase compose --extraction data/headline/extraction.json --variant ${{ matrix.variant }} --output data/headline/result-${{ matrix.variant }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headline-brief-${{ matrix.variant }}
          path: data/headline/result-${{ matrix.variant }}.json
