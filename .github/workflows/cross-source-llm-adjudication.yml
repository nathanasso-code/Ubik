name: Cross-source LLM adjudication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Collect fresh candidate pairs and probe text
        run: |
          python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/llm-ambiguity-rss.json
          python -m ingestion.cross_source_candidate_mining data/discovery/llm-ambiguity-rss.json --output data/discovery/llm-ambiguity-candidates.json
          python -m ingestion.cross_source_pair_text_probe data/discovery/llm-ambiguity-candidates.json --output data/discovery/llm-ambiguity-coverage.json
      - name: Analyze up to four pairs with Groq
        env:
          UBIK_LLM_ENDPOINT: https://api.groq.com/openai/v1/chat/completions
          UBIK_LLM_MODEL: llama-3.3-70b-versatile
          UBIK_LLM_API_KEY: ${{ secrets.UBIK_LLM_API_KEY }}
        run: |
          if [ -z "$UBIK_LLM_API_KEY" ]; then echo 'Missing UBIK_LLM_API_KEY'; exit 1; fi
          python -m ingestion.cross_source_llm_adjudication data/discovery/llm-ambiguity-coverage.json --output data/discovery/llm-cross-source-results.json --limit 4 --execute
          python - <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path("data/discovery/llm-cross-source-results.json").read_text())
          print("LLM coverage:",result["summary"])
          if not result["summary"]["analyzed"]:sys.exit("No LLM inferences succeeded")
          PY
      - name: Upload inspectable LLM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-llm-adjudication
          path: data/discovery/llm-cross-source-results.json
          if-no-files-found: warn
