name: Multilingual semantic topic routing pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/semantic-topic-routing-pilot.yml'
permissions:
  contents: read
jobs:
  semantic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify closed-catalog routing contracts
        run: python -m unittest discover -s tests -p 'test_semantic_topic_router.py'
      - name: Install pinned-major optional embedding runtime
        run: python -m pip install 'sentence-transformers>=3,<6'
      - name: Collect global publisher and social observations
        run: |
          python -m ingestion.global_rss_pilot --output data/discovery/semantic-rss.json
          python -m ingestion.global_discovery data/discovery/semantic-rss.json --output data/discovery/semantic-candidates.json
          python -m ingestion.global_social_followup --candidates data/discovery/semantic-candidates.json --output data/discovery/semantic-social.json --max-terms 6 --limit 20 --live
      - name: Embed observed hashtags and existing topics
        run: |
          python -m ingestion.semantic_topic_router --social data/discovery/semantic-social.json --catalog data/catalog.json --output data/discovery/semantic-topic-review.json --live-model
      - name: Preserve auditable review-only output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-topic-review
          path: |
            data/discovery/semantic-rss.json
            data/discovery/semantic-candidates.json
            data/discovery/semantic-social.json
            data/discovery/semantic-topic-review.json
          retention-days: 14
          if-no-files-found: warn
