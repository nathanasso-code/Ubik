name: Ubik dual cluster experiments
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/ubik-dual-cluster.yml'
      - 'ingestion/frozen_qwen_cluster_dual.py'
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        variant: [elements, focus]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: python -m py_compile ingestion/frozen_qwen_cluster_dual.py
      - name: Retrieve frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/cluster
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/cluster
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/cluster
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/cluster
      - name: Cluster-level Qwen analysis
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_qwen_cluster_dual data/cluster/neural-expanded-candidates.json data/cluster/hybrid-qwen-review.json data/cluster/original-texts.json --variant "${{ matrix.variant }}" --output "data/cluster/result-${{ matrix.variant }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-cluster-${{ matrix.variant }}-results
          path: data/cluster/result-${{ matrix.variant }}.json
          if-no-files-found: warn
