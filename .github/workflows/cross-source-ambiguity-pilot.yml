name: Cross-source ambiguity empirical pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/cross-source-ambiguity-pilot.yml'
      - 'ingestion/cross_source_candidate_mining.py'
      - 'tests/test_cross_source_candidate_mining.py'
      - 'tests/test_cross_source_pair_text_probe.py'
      - 'ingestion/render_cross_source_review.py'
      - 'ingestion/cross_source_pair_text_probe.py'
      - 'ingestion/preview_cross_source_cards.py'
      - 'ingestion/global_rss_pilot.py'
      - 'config/source-registry.global-pilot.json'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction libraries
        run: python -m pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Test pair candidate mining
        run: python -m unittest discover -s tests -p 'test_cross_source_candidate_mining.py' && python -m unittest discover -s tests -p 'test_cross_source_pair_text_probe.py'
      - name: Discover global RSS corpus
        run: python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/ambiguity-rss.json
      - name: Rank cross-publisher pairs including difficult distinctions
        run: python -m ingestion.cross_source_candidate_mining data/discovery/ambiguity-rss.json --output data/discovery/ambiguity-candidate-pairs.json
      - name: Generate human-readable source comparison
        run: python -m ingestion.render_cross_source_review data/discovery/ambiguity-candidate-pairs.json --output data/discovery/ambiguity-review.md
      - name: Probe accessible text in high, medium and borderline pairs
        run: python -m ingestion.cross_source_pair_text_probe data/discovery/ambiguity-candidate-pairs.json --output data/discovery/ambiguity-pair-text-coverage.json
      - name: Preview connected source candidate cards
        run: python -m ingestion.preview_cross_source_cards data/discovery/ambiguity-pair-text-coverage.json --output data/discovery/ambiguity-card-preview.json
      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-ambiguity-pilot
          path: |
            data/discovery/ambiguity-rss.json
            data/discovery/ambiguity-candidate-pairs.json
            data/discovery/ambiguity-review.md
            data/discovery/ambiguity-pair-text-coverage.json
            data/discovery/ambiguity-card-preview.json
          if-no-files-found: warn
