name: Secret names (prints only the names of the repository secrets, never their values)
on:
  push:
    branches: [main]
    paths: [runs/secret-names.request]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Names only
        env:
          ALL: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          python3 -c "import json,os; print('::notice title=secrets::' + ', '.join(sorted(k for k in json.loads(os.environ['ALL']) if k != 'github_token')))"
          python3 -c "import json,os; print('::notice title=variables::' + ', '.join(sorted(json.loads(os.environ['VARS'] or '{}'))))"
