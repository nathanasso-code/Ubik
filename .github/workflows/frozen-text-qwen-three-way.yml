name: Frozen text Qwen and three-way HTML
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/frozen-text-qwen-three-way.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve frozen graph, metadata judgments, and original texts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/three-way
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/three-way
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/three-way
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/three-way
      - name: Qwen reassessment on original article text
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_text_qwen_review data/three-way/neural-expanded-candidates.json data/three-way/hybrid-qwen-review.json data/three-way/original-texts.json --max-calls 20 --output data/three-way/text-qwen-review.json
      - name: Build complete three-way interactive HTML report
        run: |
          python -u -m ingestion.three_way_comparison_page data/three-way/neural-expanded-candidates.json data/three-way/hybrid-qwen-review.json data/three-way/original-texts.json data/three-way/text-qwen-review.json --output data/three-way/index.html --json-output data/three-way/summary.json
      - name: Publish HTML and experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-three-way-html-report
          path: |
            data/three-way/index.html
            data/three-way/summary.json
            data/three-way/text-qwen-review.json
          if-no-files-found: warn
