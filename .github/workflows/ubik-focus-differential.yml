name: Ubik focus differential benchmark
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths: ['.github/workflows/ubik-focus-differential.yml', 'ingestion/frozen_qwen_focus_differential.py']
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/focus
          gh run download 39075100154 --name frozen-neural-expanded-candidates --dir data/focus
          gh run download 39076957811 --name hybrid-qwen-adjudication-pilot --dir data/focus
          gh run download 39107689997 --name frozen-original-texts-pilot --dir data/focus
      - name: Run differential focus
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_focus_differential data/focus/neural-expanded-candidates.json data/focus/hybrid-qwen-review.json data/focus/original-texts.json --output data/focus/result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-differential-results
          path: data/focus/result.json
