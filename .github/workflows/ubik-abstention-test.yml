name: Ubik no-forced-grouping A/B
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/ubik-abstention-test.yml'
      - 'ingestion/frozen_qwen_abstention_test.py'
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: python -m py_compile ingestion/frozen_qwen_abstention_test.py
      - name: Retrieve frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/abstention
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/abstention
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/abstention
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/abstention
      - name: Compare identical extraction with and without abstention prior
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_qwen_abstention_test data/abstention/neural-expanded-candidates.json data/abstention/hybrid-qwen-review.json data/abstention/original-texts.json --output data/abstention/result.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-abstention-test-results
          path: data/abstention/result.json
          if-no-files-found: warn
