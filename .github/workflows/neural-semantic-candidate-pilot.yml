name: Neural semantic candidate pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/neural_semantic_candidate_pilot.py'
      - '.github/workflows/neural-semantic-candidate-pilot.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural embeddings
        run: pip install 'sentence-transformers>=3,<6' 'numpy>=1.26,<3'
      - name: Collect RSS and compute baseline
        run: |
          python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/semantic-rss.json
          python -m ingestion.cross_source_candidate_mining data/discovery/semantic-rss.json --output data/discovery/semantic-baseline.json --top-k 5000
      - name: Retrieve neural candidates missing from TF-IDF top 5000
        run: |
          python -m ingestion.neural_semantic_candidate_pilot data/discovery/semantic-rss.json data/discovery/semantic-baseline.json --output data/discovery/semantic-candidates.json --top-k 100
      - name: Upload reproducible candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: neural-semantic-candidate-pilot
          path: |
            data/discovery/semantic-candidates.json
            data/discovery/semantic-baseline.json
