name: Ubik Core checks
on:
  push:
    branches:
      - develop/ubik-core
  pull_request:
    branches:
      - main
jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in assets/*.js assets/*.cjs tests/*.cjs; do node --check "$f"; done
      - name: Run contract tests
        run: |
          node tests/ubik-core.test.cjs
          node tests/provenance-view.test.cjs
          node tests/temporal.test.cjs
          node tests/map-view.test.cjs
          node tests/integration-static.test.cjs
          node tests/knowledge-pipeline.test.cjs
          node tests/epistemic-pilot.test.cjs
          node tests/epistemic-evaluation.test.cjs
          node tests/conservative-event-proposals.test.cjs
      - name: Run offline source discovery tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Evaluate reference baseline (diagnostic only)
        run: |
          python scripts/baseline_verified_event_pairs.py data/evaluation/verified-event-pairs-v1.json /tmp/ubik-event-baseline.json
          python scripts/evaluate_verified_event_pairs.py data/evaluation/verified-event-pairs-v1.json /tmp/ubik-event-baseline.json
      - name: Audit reference-set quality (diagnostic only)
        run: python scripts/audit_event_reference.py data/evaluation/verified-event-pairs-v1.json
