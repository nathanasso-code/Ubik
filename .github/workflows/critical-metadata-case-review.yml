name: Critical metadata case split review
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/critical_metadata_case_review.py'
      - '.github/workflows/critical-metadata-case-review.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen Qwen proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/discovery/review
          gh run download 39057949208 --repo "${{ github.repository }}" --name metadata-first-qwen-groups --dir data/discovery/review
      - name: Consolidate cases deterministically
        run: |
          python -m ingestion.consolidate_metadata_cases data/discovery/review/metadata-group-review.json --output data/discovery/metadata-consolidated-cases.json
      - name: Critical disjoint Qwen split review
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.critical_metadata_case_review data/discovery/metadata-consolidated-cases.json --output data/discovery/critical-metadata-review.json --limit 5
      - name: Archive review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-metadata-case-review
          path: |
            data/discovery/metadata-consolidated-cases.json
            data/discovery/critical-metadata-review.json
          if-no-files-found: warn
