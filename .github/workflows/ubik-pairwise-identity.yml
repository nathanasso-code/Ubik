name: Ubik neutral pairwise identity
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/ubik-pairwise-identity.yml'
      - 'ingestion/frozen_qwen_pairwise_identity.py'
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: python -m py_compile ingestion/frozen_qwen_pairwise_identity.py
      - name: Retrieve frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/pairwise
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/pairwise
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/pairwise
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/pairwise
      - name: Extract primary event and judge pairs neutrally
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_qwen_pairwise_identity data/pairwise/neural-expanded-candidates.json data/pairwise/hybrid-qwen-review.json data/pairwise/original-texts.json --output data/pairwise/result.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-pairwise-identity-results
          path: data/pairwise/result.json
          if-no-files-found: warn
