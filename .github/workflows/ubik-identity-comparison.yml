name: Ubik identity vs repaired clusters
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/frozen_qwen_identity_comparison.py'
      - '.github/workflows/ubik-identity-comparison.yml'
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [identity, repair]
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile ingestion/frozen_qwen_identity_comparison.py
      - name: Download frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/identity
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/identity
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/identity
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/identity
      - name: Run independent experiment
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_qwen_identity_comparison data/identity/neural-expanded-candidates.json data/identity/hybrid-qwen-review.json data/identity/original-texts.json --variant "${{ matrix.variant }}" --output "data/identity/result-${{ matrix.variant }}.json"
      - name: Preserve partial and complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-comparison-${{ matrix.variant }}
          path: data/identity/result-${{ matrix.variant }}.json
          if-no-files-found: warn
