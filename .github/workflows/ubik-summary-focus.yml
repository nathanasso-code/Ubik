name: Ubik summary central focus benchmark
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths: ['.github/workflows/ubik-summary-focus.yml', 'ingestion/frozen_qwen_summary_focus.py']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          python -m py_compile ingestion/frozen_qwen_summary_focus.py
      - name: Retrieve identical frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/extraction-ab
          gh run download 39075100154 --repo "${{ github.repository }}" --name frozen-neural-expanded-candidates --dir data/extraction-ab
          gh run download 39076957811 --repo "${{ github.repository }}" --name hybrid-qwen-adjudication-pilot --dir data/extraction-ab
          gh run download 39107689997 --repo "${{ github.repository }}" --name frozen-original-texts-pilot --dir data/extraction-ab
      - name: Summary then central focus and shared development
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -u -m ingestion.frozen_qwen_summary_focus data/extraction-ab/neural-expanded-candidates.json data/extraction-ab/hybrid-qwen-review.json data/extraction-ab/original-texts.json --output data/extraction-ab/result-focus.json
      - name: Upload focus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubik-summary-focus-results
          path: |
            data/extraction-ab/result-focus.json
          if-no-files-found: warn
