name: Acquisition coverage live pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - '.github/workflows/acquisition-coverage-live-pilot.yml'
      - 'ingestion/discovery_acquisition_gap_audit.py'
      - 'ingestion/live_get_text_probe.py'
      - 'ingestion/offline_extractor_comparison.py'
      - 'ingestion/acquisition_quality_report.py'
      - 'ingestion/global_rss_pilot.py'
      - 'config/source-registry.global-pilot.json'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline article extraction libraries
        run: python -m pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Test coverage accounting
        run: python -m unittest discover -s tests -p 'test_discovery_acquisition_gap_audit.py' && python -m unittest discover -s tests -p 'test_live_probe_sampling.py' && python -m unittest discover -s tests -p 'test_structured_article_probe.py' && python -m unittest discover -s tests -p 'test_offline_extractor_comparison.py'
      - name: Discover cross-disciplinary RSS articles
        run: python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/live-coverage-rss.json
      - name: Probe a bounded cross-domain sample with robots checks
        run: python -m ingestion.live_get_text_probe data/discovery/live-coverage-rss.json --max-urls 90 --per-host 7 --seed 42 --method stratified --output data/discovery/live-coverage-probes.json
      - name: Report discovery and acquisition coverage without mistaking unattempted URLs for extraction failures
        run: |
          python -m ingestion.discovery_acquisition_gap_audit --discovery data/discovery/live-coverage-rss.json --output data/discovery/live-coverage-discovery-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("data/discovery")
          discovery=json.loads((base/"live-coverage-discovery-audit.json").read_text())
          probe=json.loads((base/"live-coverage-probes.json").read_text())
          from ingestion.acquisition_quality_report import summarize
          domains=summarize(probe['probes'])
          structured=[x for x in probe['probes'] if x.get('structured_article_max_chars',0)>=800]
          print('Structured articleBody >=800 chars:',len(structured),'of',len(probe['probes']))
          rows=probe['probes']
          html={r['url'] for r in rows if r.get('content_tier')=='substantial_article_text_accessible'}
          ld={r['url'] for r in rows if r.get('structured_article_max_chars',0)>=800}
          added=ld-html
          by_host={}
          from urllib.parse import urlsplit
          for r in rows:
              host=urlsplit(r['url']).hostname
              cell=by_host.setdefault(host,{'sampled':0,'html':0,'jsonld':0,'both':0,'jsonld_only':0})
              h=r['url'] in html
              s=r['url'] in ld
              cell['sampled']+=1
              cell['html']+=int(h)
              cell['jsonld']+=int(s)
              cell['both']+=int(h and s)
              cell['jsonld_only']+=int(s and not h)
          comparison={'sampled':len(rows),'html_article_signal':len(html),'jsonld_800plus':len(ld),
                      'overlap':len(html & ld),'jsonld_only':len(added),'union':len(html | ld),
                      'by_host':by_host,
                      'limitations':['JSON-LD body length is not verified article completeness.',
                                     'JSON-LD-only does not prove the article is clean or licensed.',
                                     'Signals compared on the same URL sample within this run.']}
          (base/'live-coverage-parser-comparison.json').write_text(json.dumps(comparison,indent=2)+'\n')
          print('Parser comparison:',json.dumps(comparison))
          engines=('trafilatura','readability')
          extraction={'sampled':len(rows),'html_substantial':len(html),'engines':{}}
          for engine in engines:
              positives={r['url'] for r in rows if r.get('alternative_extractors',{}).get(engine,{}).get('substantial_800')}
              errors=sum(bool(r.get('alternative_extractors',{}).get(engine,{}).get('error_type')) for r in rows)
              extraction['engines'][engine]={'positive':len(positives),
                  'html_overlap':len(positives & html),'additional_to_html':len(positives-html),
                  'union_with_html':len(positives|html),'errors':errors,
                  'by_host':{host:sum(r['url'] in positives for r in rows if urlsplit(r['url']).hostname==host)
                             for host in by_host}}
          strict={'threshold':'1200_chars_180_words','baseline_html':len(html),'engines':{}}
          for engine in engines:
              positive={r['url'] for r in rows if r.get('alternative_extractors',{}).get(engine,{}).get('substantial_1200_180')}
              strict['engines'][engine]={'positive':len(positive),'overlap_html':len(positive & html),
                  'additional_html':len(positive-html),'union_html':len(positive|html),
                  'by_host':{host:sum(r['url'] in positive for r in rows if urlsplit(r['url']).hostname==host) for host in by_host}}
          extraction['equal_threshold_comparison']=strict
          quality={'scope':'Trafilatura-only additional candidates relative to HTML at 1200 chars / 180 words',
                   'candidates':[],'summary':{}}
          for r in rows:
              t=r.get('alternative_extractors',{}).get('trafilatura',{})
              if r['url'] in html or not t.get('substantial_1200_180'):continue
              quality['candidates'].append({'url':r['url'],'host':urlsplit(r['url']).hostname,
                  'chars':t.get('chars'),'words':t.get('words'),
                  'long_sentences':t.get('long_sentences'),
                  'repeated_long_sentences':t.get('repeated_long_sentences'),
                  'boilerplate_phrase_hits':t.get('boilerplate_phrase_hits')})
          quality['summary']={'candidate_count':len(quality['candidates']),
              'with_boilerplate_phrases':sum(bool(x['boilerplate_phrase_hits']) for x in quality['candidates']),
              'with_repeated_long_sentences':sum(bool(x['repeated_long_sentences']) for x in quality['candidates']),
              'with_zero_long_sentences':sum(x['long_sentences']==0 for x in quality['candidates'])}
          quality['limitations']=['These automated signals are weak contamination checks, not human validation.',
                                  'No extracted text is stored; URL-level review requires authorized transient access.']
          (base/'live-coverage-extraction-quality.json').write_text(json.dumps(quality,indent=2)+'\n')
          print('Extraction quality screening:',json.dumps(quality['summary']))
          extraction['limitations']=['800 characters and 100 words is a screening threshold, not validated article text.',
                                      'No article text stored; manual quality evaluation still required.']
          (base/'live-coverage-offline-extractors.json').write_text(json.dumps(extraction,indent=2)+'\n')
          print('Offline extractor comparison:',json.dumps(extraction))
          (base/'live-coverage-by-domain.json').write_text(json.dumps(domains,indent=2)+'\n')
          print('Domain-level diagnostics:',json.dumps(domains))
          out={"schema_version":1,"discovery":discovery["discovery"],"probe":probe["coverage"],
               "sample_fraction":round(probe["coverage"]["tested_urls"]/discovery["discovery"]["unique_urls"],4) if discovery["discovery"]["unique_urls"] else None,
               "limitations":["Unprobed discovered URLs are not extraction failures.",
                              "Substantial article-tag text is not confirmed full text.",
                              "Probe does not store copyrighted article bodies or verify republication rights."]}
          (base/"live-coverage-summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
      - name: Upload reproducible reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-coverage-live-pilot
          path: |
            data/discovery/live-coverage-rss.json
            data/discovery/live-coverage-probes.json
            data/discovery/live-coverage-discovery-audit.json
            data/discovery/live-coverage-summary.json
            data/discovery/live-coverage-by-domain.json
            data/discovery/live-coverage-parser-comparison.json
            data/discovery/live-coverage-offline-extractors.json
            data/discovery/live-coverage-extraction-quality.json
          if-no-files-found: warn
