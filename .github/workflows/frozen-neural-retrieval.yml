name: Frozen neural retrieval A-B pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/neural_candidate_retrieval.py'
      - '.github/workflows/frozen-neural-retrieval.yml'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install embedding model dependencies
        run: python -m pip install 'sentence-transformers>=3,<6' 'numpy>=1.26,<3'
      - name: Download same frozen TF-IDF corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/benchmark
          gh run download 39052746507 --repo "${{ github.repository }}" --name metadata-first-corpus-candidates --dir data/benchmark
      - name: Expand candidates with multilingual embeddings
        run: |
          python -u -m ingestion.neural_candidate_retrieval data/benchmark/metadata-first-candidates.json --output data/benchmark/neural-expanded-candidates.json --top-k 4 --threshold 0.67
      - name: Publish full paired candidate lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-neural-expanded-candidates
          path: data/benchmark/neural-expanded-candidates.json
          if-no-files-found: warn
