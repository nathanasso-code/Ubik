name: Concept candidate recovery pilot
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/concept_candidate_probe.py'
      - 'tests/test_concept_candidate_probe.py'
      - '.github/workflows/concept-candidate-recovery.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate recovery
        run: python -m unittest discover -s tests -p 'test_concept_candidate_probe.py'
      - name: Collect fresh corpus and lexical baseline
        run: |
          python -m ingestion.global_rss_pilot --registry config/source-registry.global-pilot.json --output data/discovery/concept-rss.json
          python -m ingestion.cross_source_candidate_mining data/discovery/concept-rss.json --output data/discovery/concept-baseline.json --top-k 5000
      - name: Recover candidates through normalized concepts
        run: |
          python -m ingestion.concept_candidate_probe data/discovery/concept-rss.json data/discovery/concept-baseline.json --output data/discovery/concept-novel-candidates.json --top-k 200
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/discovery/concept-novel-candidates.json').read_text())
          for p in x['candidates'][:12]:
              print('NOVEL CANDIDATE (UNVERIFIED):',p['left']['title'],'<>',p['right']['title'])
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: concept-candidate-recovery
          path: data/discovery/concept-novel-candidates.json
