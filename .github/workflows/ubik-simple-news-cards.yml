name: Ubik simple incremental news cards
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/frozen_qwen_simple_news_cards.py'
      - '.github/workflows/ubik-simple-news-cards.yml'
permissions:
  contents: read
  actions: read
jobs:
  simple:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen per-source news
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/simple
          gh run download 39660157545 --name headline-brief-extraction --dir data/simple
      - name: Incrementally attach sources to canonical news cards
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u -m ingestion.frozen_qwen_simple_news_cards data/simple/extraction.json --output data/simple/simple-news-cards.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-news-cards-result
          path: data/simple/simple-news-cards.json
