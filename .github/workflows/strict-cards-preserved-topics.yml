name: Strict cards with preserved topics
on:
  workflow_dispatch:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/strict_cards_preserved_topics.py'
      - '.github/workflows/strict-cards-preserved-topics.yml'
permissions:
  contents: read
  actions: read
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: pip install 'trafilatura==2.3.1' 'readability-lxml==0.9.0'
      - name: Download both frozen reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/discovery/frozen/pairs data/discovery/frozen/topics
          gh run download 39017110794 --repo "${{ github.repository }}" --name semantic-llm-relationships --dir data/discovery/frozen/pairs
          gh run download 39026959251 --repo "${{ github.repository }}" --name full-corpus-topic-grouping --dir data/discovery/frozen/topics
          test -s data/discovery/frozen/pairs/semantic-llm-relationships.json
          test -s data/discovery/frozen/topics/full-corpus-topic-grouping.json
      - name: Recheck all prior pairs under near-identical news card criterion
        env:
          UBIK_LLM_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          UBIK_LLM_MODEL: qwen/qwen3-32b
          UBIK_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$UBIK_LLM_API_KEY"
          python -m ingestion.strict_cards_preserved_topics data/discovery/frozen/pairs/semantic-llm-relationships.json data/discovery/frozen/topics/full-corpus-topic-grouping.json --output data/discovery/frozen/strict-cards-preserved-topics.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-cards-preserved-topics
          path: data/discovery/frozen/strict-cards-preserved-topics.json
          if-no-files-found: warn
