name: Global topic-agnostic discovery pilot
on:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/global_discovery.py'
      - 'ingestion/blind_relation_hypotheses.py'
      - 'ingestion/blind_semantic_neighbors.py'
      - 'ingestion/epistemic_review_queue.py'
      - 'ingestion/epistemic_evidence_gate.py'
      - 'ingestion/authorized_source_text.py'
      - 'ingestion/semantic_discovery_cards.py'
      - 'ingestion/approved_https_fetch.py'
      - 'ingestion/approved_claim_pipeline.py'
      - 'ingestion/source_claim_candidates.py'
      - 'ingestion/source_claim_comparisons.py'
      - 'ingestion/evidence_review_cards.py'
      - 'ingestion/evidence_card_fixture.py'
      - 'ingestion/semantic_empirical_audit.py'
      - 'ingestion/curated_evidence_merge.py'
      - 'ingestion/empirical_mx_storms_case.py'
      - 'ingestion/global_event_pairs.py'
      - 'ingestion/global_cards.py'
      - 'ingestion/global_social_followup.py'
      - 'ingestion/hybrid_document_links.py'
      - 'ingestion/hashtag_topic_routing.py'
      - 'ingestion/global_rss_pilot.py'
      - 'ingestion/rss_evidence_audit.py'
      - 'ingestion/transparent_corpus_catalog.py'
      - 'ingestion/http_access_probe.py'
      - 'ingestion/live_get_text_probe.py'
      - 'ingestion/persistent_discovery_ledger.py'
      - 'tests/test_persistent_discovery_ledger.py'
      - 'ingestion/render_corpus_feed.py'
      - 'tests/test_transparent_corpus_catalog.py'
      - 'config/source-registry.global-pilot.json'
      - 'tests/test_global_discovery.py'
      - 'tests/test_blind_relation_hypotheses.py'
      - 'tests/test_blind_semantic_neighbors.py'
      - 'tests/test_semantic_pair_review_queue.py'
      - 'tests/test_epistemic_evidence_gate.py'
      - 'tests/test_authorized_source_text.py'
      - 'tests/test_semantic_discovery_cards.py'
      - 'tests/test_approved_https_fetch.py'
      - 'tests/test_approved_claim_pipeline.py'
      - 'tests/test_source_claim_pipeline.py'
      - 'tests/test_evidence_review_cards.py'
      - 'tests/test_semantic_empirical_audit.py'
      - 'tests/test_curated_evidence_merge.py'
      - 'tests/test_global_event_pairs.py'
      - 'tests/test_global_cards.py'
      - 'tests/test_hybrid_discovery.py'
      - 'tests/test_global_rss_pilot.py'
      - '.github/workflows/global-discovery-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore prior persistent corpus
        uses: actions/cache/restore@v4
        with:
          path: data/persistent
          key: ubik-corpus-ledger-${{ github.run_id }}
          restore-keys: |
            ubik-corpus-ledger-
      - name: Run persistent ledger tests
        run: python -m unittest discover -s tests -p 'test_persistent_discovery_ledger.py'
      - name: Run global discovery unit tests
        run: python -m unittest discover -s tests -p 'test_global*.py' && python -m unittest discover -s tests -p 'test_hybrid*.py' && python -m unittest discover -s tests -p 'test_blind*.py'
      - name: Run source acquisition and claim pipeline safety tests (mocked, no live article fetch)
        run: python -m unittest discover -s tests -p 'test_approved*.py' && python -m unittest discover -s tests -p 'test_source_claim_pipeline.py' && python -m unittest discover -s tests -p 'test_epistemic_evidence_gate.py' && python -m unittest discover -s tests -p 'test_evidence_review_cards.py'
      - name: Run curated empirical evidence merge tests
        run: python -m unittest discover -s tests -p 'test_curated_evidence_merge.py'
      - name: Generate source-grounded empirical case from short public excerpts
        run: python -m ingestion.empirical_mx_storms_case --output data/discovery/empirical-mexico-storms-case.json
      - name: Generate synthetic evidence-review card fixture (never real news)
        run: python -m ingestion.evidence_card_fixture --output data/discovery/synthetic-evidence-review-card.json
      - name: Collect diverse publisher feeds without topic seed
        run: python -m ingestion.global_rss_pilot --output data/discovery/global-rss-pilot.json
      - name: Audit RSS description evidence coverage
        run: python -m ingestion.rss_evidence_audit data/discovery/global-rss-pilot.json --output data/discovery/rss-evidence-audit.json
      - name: Empirically probe a bounded sample of article HTTP metadata
        run: python -m ingestion.http_access_probe data/discovery/global-rss-pilot.json --output data/discovery/http-access-probe.json --max-urls 90
      - name: Test live article GET text access with robots checks
        run: python -m ingestion.live_get_text_probe data/discovery/global-rss-pilot.json --output data/discovery/live-get-text-access.json --max-urls 100
      - name: Discover candidate terms globally
        run: python -m ingestion.global_discovery data/discovery/global-rss-pilot.json --output data/discovery/global-candidates-pilot.json
      - name: Discover unseeded document co-mention hypotheses
        run: python -m ingestion.blind_relation_hypotheses data/discovery/global-rss-pilot.json --output data/discovery/blind-relations-review.json
      - name: Generate conservative cross-publisher same-event review pairs
        run: python -m ingestion.global_event_pairs data/discovery/global-rss-pilot.json --output data/discovery/global-event-pairs-review.json
      - name: Sample public social links from globally discovered terms
        run: python -m ingestion.global_social_followup --candidates data/discovery/global-candidates-pilot.json --output data/discovery/global-social-followup.json --max-terms 6 --limit 20 --live
      - name: Join publisher and social-discovered document links
        run: python -m ingestion.hybrid_document_links --rss data/discovery/global-rss-pilot.json --social data/discovery/global-social-followup.json --output data/discovery/global-hybrid-links.json
      - name: Merge current RSS, social and GET evidence into persistent corpus
        run: python -m ingestion.persistent_discovery_ledger --previous data/persistent/corpus.json --rss data/discovery/global-rss-pilot.json --hybrid data/discovery/global-hybrid-links.json --access data/discovery/live-get-text-access.json --output data/persistent/corpus.json
      - name: Save updated persistent corpus for subsequent runs
        uses: actions/cache/save@v4
        with:
          path: data/persistent
          key: ubik-corpus-ledger-${{ github.run_id }}
      - name: Propose contextual hashtag links to existing topics
        run: python -m ingestion.hashtag_topic_routing --social data/discovery/global-social-followup.json --catalog data/catalog.json --output data/discovery/global-hashtag-topic-review.json
      - name: Show hashtag-topic review candidates with evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/discovery/global-hashtag-topic-review.json').read_text())
          print(json.dumps({'eligible':d['hashtags_eligible'],'suggestions':d['suggestions'][:20]},ensure_ascii=False))
          PY
      - name: Generate source-grounded review cards
        run: python -m ingestion.global_cards data/discovery/global-rss-pilot.json data/discovery/global-event-pairs-review.json --output data/discovery/global-cards-preview.json --markdown data/discovery/global-cards-preview.md
      - name: Summarize coverage and top unreviewed candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("data/discovery/global-rss-pilot.json").read_text())
          b=json.loads(Path("data/discovery/global-candidates-pilot.json").read_text())
          print(json.dumps({"coverage":a["coverage"],"source_reports":a["source_reports"],
                            "candidate_terms":b["candidate_terms"][:25],
                            "limitations":b["limitations"]},ensure_ascii=False))
          PY
      - name: Preserve raw pilot and candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-discovery-pilot
          path: |
            data/discovery/empirical-mexico-storms-case.json
            data/discovery/synthetic-evidence-review-card.json
            data/discovery/global-rss-pilot.json
            data/discovery/rss-evidence-audit.json
            data/discovery/http-access-probe.json
            data/discovery/live-get-text-access.json
            data/discovery/global-candidates-pilot.json
            data/discovery/blind-relations-review.json
            data/discovery/global-event-pairs-review.json
            data/discovery/global-cards-preview.json
            data/discovery/global-cards-preview.md
            data/discovery/global-social-followup.json
            data/discovery/global-hybrid-links.json
            data/persistent/corpus.json
            data/discovery/global-hashtag-topic-review.json
          if-no-files-found: warn
          retention-days: 14

  semantic-review:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install multilingual semantic model
        run: python -m pip install 'sentence-transformers>=3,<6'
      - name: Retrieve immutable discovery inputs from this run
        uses: actions/download-artifact@v4
        with:
          name: global-discovery-pilot
          path: data/discovery
      - name: Discover blind multilingual document neighbors on frozen RSS
        run: python -m ingestion.blind_semantic_neighbors data/discovery/global-rss-pilot.json --output data/discovery/blind-semantic-neighbors.json --live-model
      - name: Join semantic neighbor candidates to RSS evidence coverage
        run: python -m ingestion.rss_evidence_audit data/discovery/global-rss-pilot.json --pairs data/discovery/blind-semantic-neighbors.json --output data/discovery/rss-semantic-evidence-audit.json
      - name: Generate reproducible random semantic error audit sample
        run: python -m ingestion.semantic_empirical_audit data/discovery/blind-semantic-neighbors.json --output data/discovery/random-semantic-audit.json --seed 20261013 --sample-size 30
      - name: Build balanced manual review queue from frozen semantic pairs
        run: python -m ingestion.epistemic_review_queue data/discovery/blind-semantic-neighbors.json --output data/discovery/semantic-pair-review-queue.json
      - name: Test and generate transparent editorial catalog from frozen corpus
        run: |
          python -m unittest discover -s tests -p 'test_transparent_corpus_catalog.py'
          python -m ingestion.transparent_corpus_catalog data/discovery/global-rss-pilot.json --neighbors data/discovery/blind-semantic-neighbors.json --output data/discovery/transparent-corpus-catalog.json
      - name: Render complete browsable HTML feed with access transparency
        run: python -m ingestion.render_corpus_feed data/discovery/transparent-corpus-catalog.json --probe data/discovery/http-access-probe.json --output data/discovery/ubik-feed-completo.html
      - name: Generate source-linked semantic card previews for editorial review
        run: python -m ingestion.semantic_discovery_cards data/discovery/semantic-pair-review-queue.json --output data/discovery/semantic-card-previews.json --markdown data/discovery/semantic-card-previews.md
      - name: Evaluate closed-catalog multilingual semantic routing
        run: |
          python -m unittest discover -s tests -p 'test_semantic_topic_router.py'
          python -m ingestion.semantic_topic_router --social data/discovery/global-social-followup.json --catalog data/catalog.json --output data/discovery/semantic-topic-review.json --live-model
      - name: Preserve semantic proposals and abstentions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-topic-review
          path: |
            data/discovery/semantic-topic-review.json
            data/discovery/blind-semantic-neighbors.json
            data/discovery/rss-semantic-evidence-audit.json
            data/discovery/transparent-corpus-catalog.json
            data/discovery/ubik-feed-completo.html
            data/discovery/random-semantic-audit.json
            data/discovery/semantic-pair-review-queue.json
            data/discovery/semantic-card-previews.json
            data/discovery/semantic-card-previews.md
          retention-days: 14
          if-no-files-found: warn
