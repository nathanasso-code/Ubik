name: OpenRouter Ubik semantic mini-pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/ubik-core
      - name: Compare two grounded pairs with a free model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          key=os.environ.get("OPENROUTER_API_KEY","")
          if not key:sys.exit("Missing OPENROUTER_API_KEY")
          url="https://openrouter.ai/api/v1/chat/completions"
          model="cohere/north-mini-code:free"
          cases=[
            ("same_event","On 12 March, City A opened a new bridge over the river.","City A inaugurated its new river bridge on March 12."),
            ("distinct_event","On 12 March, City A opened a new bridge over the river.","On 12 March, City B announced plans for a new bridge over a different river."),
            ("contradiction","The research team reported 120 participants in the trial.","The research team reported 210 participants in the same trial.")
          ]
          results=[]
          for expected,a,b in cases:
            prompt="Classify the relationship between these two statements as same_event, distinct_event, contradiction, or uncertain. Return ONLY the label. A: "+a+" B: "+b
            body=json.dumps({"model":model,"messages":[{"role":"user","content":prompt}],"max_tokens":120}).encode()
            req=urllib.request.Request(url,data=body,headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=50) as resp:
                payload=json.load(resp)
              answer=payload["choices"][0]["message"].get("content","")
              usage=payload.get("usage",{})
              print("Case:",expected,"| response:",str(answer)[:150],"| cost:",usage.get("cost"),"| tokens:",usage.get("total_tokens"))
              results.append({"expected":expected,"response":answer,"usage":usage})
            except urllib.error.HTTPError as exc:
              print("HTTP error:",exc.code)
              sys.exit(1)
          with open("openrouter-semantic-mini-results.json","w") as f:json.dump(results,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openrouter-semantic-mini-results
          path: openrouter-semantic-mini-results.json
          if-no-files-found: warn
