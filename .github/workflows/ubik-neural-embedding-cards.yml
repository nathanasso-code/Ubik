name: Ubik neural embedding cards
on:
  push:
    branches: [develop/ubik-core]
    paths:
      - 'ingestion/frozen_neural_embedding_cards.py'
      - '.github/workflows/ubik-neural-embedding-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural embedding model
        run: pip install sentence-transformers scikit-learn
      - name: Download completed grounded experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/neural-cards
          gh run download 39822649930 --name grounded-global-news-cards --dir data/neural-cards
      - name: Cluster existing news without re-extraction
        run: python -m ingestion.frozen_neural_embedding_cards data/neural-cards/result.json --output data/neural-cards/embedding-cards.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-embedding-cards
          path: data/neural-cards/embedding-cards.json

# Retrigger after clearing legacy Actions queue.
