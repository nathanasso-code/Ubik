<title>Esploratore Ubik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a newsroom workbench. A slim index on the left (Cantiere, Topic, Nodi, Voci), one reading column on the
   right; every object carries its site-of-work strip (state, how it was built, cost, what is missing). */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #18202c;
  --muted: #5b6676;
  --line: #dde2e9;
  --accent: #0e6a73;
  --accent-soft: #e2f0f1;
  --quote: #33415a;
  --st-bozza: #9a6400; --st-bozza-bg: #fbf0d9;
  --st-ok: #1f6b3a; --st-ok-bg: #e1f2e6;
  --st-ver: #2852a3; --st-ver-bg: #e3eafa;
  --st-upd: #a2421c; --st-upd-bg: #fbe5dc;
  --st-off: #5b6676; --st-off-bg: #eceff3;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --panel: #18202a; --ink: #e4e9f0; --muted: #98a3b3; --line: #2a3442; --accent: #5cc3cc; --accent-soft: #173238; --quote: #c3cede;
  --st-bozza: #f0c060; --st-bozza-bg: #3a2e14; --st-ok: #7fd49a; --st-ok-bg: #18301f; --st-ver: #93b2f2; --st-ver-bg: #1c2840;
  --st-upd: #f2a07e; --st-upd-bg: #3a2218; --st-off: #98a3b3; --st-off-bg: #232c38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #18202a; --ink: #e4e9f0; --muted: #98a3b3; --line: #2a3442; --accent: #5cc3cc; --accent-soft: #173238; --quote: #c3cede;
  --st-bozza: #f0c060; --st-bozza-bg: #3a2e14; --st-ok: #7fd49a; --st-ok-bg: #18301f; --st-ver: #93b2f2; --st-ver-bg: #1c2840;
  --st-upd: #f2a07e; --st-upd-bg: #3a2218; --st-off: #98a3b3; --st-off-bg: #232c38; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px }
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px }
nav.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; display: grid; gap: 18px; font-size: 14px }
.brand { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; line-height: 1 }
.brand small { display: block; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px }
.index h4 { margin: 0 0 6px; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.index ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.index a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none }
.index a:hover { background: var(--accent-soft) }
.index a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.index a .k { font: 400 11px var(--mono); color: var(--muted); margin-left: 4px }
main { min-width: 0; display: grid; gap: 28px; align-content: start }
.crumb { font: 500 12px/1.4 var(--mono); color: var(--muted); letter-spacing: .03em }
.crumb a { color: var(--muted) }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.12; letter-spacing: -0.015em; margin: 4px 0 0; text-wrap: balance }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.25; margin: 0; text-wrap: balance }
h3 { font-family: var(--body); font-weight: 600; font-size: 16px; line-height: 1.35; margin: 0 }
.lead { font-size: 17px; color: var(--ink); max-width: 68ch; margin: 10px 0 0 }
.muted { color: var(--muted) }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }
section { display: grid; gap: 14px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0 }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--body); padding: 4px 9px; border-radius: 999px; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.st-bozza { color: var(--st-bozza); background: var(--st-bozza-bg) }
.st-verificato { color: var(--st-ver); background: var(--st-ver-bg) }
.st-pubblicato { color: var(--st-ok); background: var(--st-ok-bg) }
.st-da-aggiornare { color: var(--st-upd); background: var(--st-upd-bg) }
.st-sospeso { color: var(--st-off); background: var(--st-off-bg) }
.chip { display: inline-block; font: 500 11.5px/1.3 var(--mono); padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); max-width: 100%; overflow-wrap: anywhere }
.src, .card, .panel, td { overflow-wrap: anywhere }
.chip.rel-simulata { border-style: dashed }
.chip.rel-ricostruita { border-color: var(--st-bozza); color: var(--st-bozza) }
.chip.rel-dichiarata { border-color: var(--accent); color: var(--accent) }
.chip.rel-verifica { border-color: var(--st-ver); color: var(--st-ver) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.site { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 12px; display: grid; gap: 6px; font-size: 13px }
.site ul { margin: 0; padding-left: 18px }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px }
.stat b { display: block; font: 600 26px/1.1 var(--display) }
.stat span { font-size: 13px; color: var(--muted) }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); position: sticky; top: 0 }
tr:last-child td { border-bottom: 0 }
td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.tabs { display: flex; flex-wrap: wrap; gap: 6px }
.tabs button { font: 500 13px var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.src { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.src:last-child { border-bottom: 0 }
.src .meta { font: 400 12px/1.4 var(--mono); color: var(--muted) }
.src .title { font-weight: 600 }
blockquote { margin: 6px 0 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent); color: var(--quote); font-style: italic }
blockquote .it { display: block; font-style: normal; color: var(--muted); font-size: 13.5px; margin-top: 3px }
.card { display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.cites { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px }
.cite { display: grid; gap: 1px; font-size: 14px }
.cite .meta { font: 400 12px/1.4 var(--mono); color: var(--muted) }
details.check > summary { font: 500 12.5px var(--body); color: var(--muted) }
.chain { display: grid; gap: 0 }
.ring { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding-bottom: 14px }
.ring .dot { position: relative; display: flex; justify-content: center }
.ring .dot::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); margin-top: 5px; z-index: 1 }
.ring .dot::after { content: ""; position: absolute; top: 14px; bottom: -14px; width: 2px; background: var(--line) }
.ring:last-child .dot::after { display: none }
.bands { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.band { display: grid; gap: 8px; align-content: start }
.band h3 { padding-bottom: 6px; border-bottom: 2px solid var(--accent) }
details > summary { cursor: pointer; font-weight: 600; padding: 4px 0 }
.map { display: grid; gap: 10px }
.map .stop { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start }
.map .ix { font: 600 15px/34px var(--display); width: 34px; height: 34px; text-align: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted) }
.map .stop.built .ix { border-color: var(--accent); color: var(--panel); background: var(--accent) }
.empty { color: var(--muted); font-style: italic }
.decide { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px }
.decide textarea { font: 400 14px/1.4 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-height: 38px; resize: vertical; width: 100% }
.decide .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.decide button { font: 500 13px var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.decide button[data-act="accettata"] { border-color: var(--st-ok); color: var(--st-ok) }
.decide button[data-act="rifiutata"] { border-color: var(--st-off); color: var(--st-off) }
.decide button[data-act="conferma"] { border-color: var(--ink); font-weight: 600 }
.decide button:disabled { opacity: .45; cursor: default }
.decided-accettata { color: var(--st-ok); background: var(--st-ok-bg) }
.decided-rifiutata { color: var(--st-off); background: var(--st-off-bg) }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px }
  nav.index { position: static; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) }
  .brand { grid-column: 1 / -1 }
}
@media (prefers-reduced-motion: no-preference) { .index a, .tabs button { transition: background .15s, color .15s } }
</style>

<div class="shell">
  <nav class="index" id="index" aria-label="Indice"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<script>
const D = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const money = v => v == null ? "non misurato" : (v < 0.01 ? "< 0,01 $" : v.toFixed(2).replace(".", ",") + " $");
const SUB = Object.fromEntries((D.topic.ia.sottotopic || []).map(s => [s.id, s.nome]));
const KIND = {cronaca: "cronaca", reazione: "reazione", analisi: "analisi", commento: "commento", documento: "documento", rassegna: "rassegna", rilancio: "rilancio", altro: "altro"};
const LANG = {it: "IT", en: "EN", fr: "FR", de: "DE", es: "ES"};
const NODE_KIND = {fatto: "Nodo di fatto", analisi: "Nodo d'analisi", affermazione: "Affermazione in circolazione", leggero: "Nodo leggero"};
const OUTCOME = {accertato: "Accertato", smentito: "Smentito", conteso: "Conteso", aperto: "Aperto"};

// ---------- editorial decisions on proposals and novelties (db capability: shared, read back by Claude)
// Each decision is a document decisioni/<node>--<id> with the reason; Claude records it in the node's files
// (reports/nodi/NODE/decisioni.json), and a decision already recorded there comes with the data.
const DEC = {};          // live decisions from the page's database
const DRAFT = {};        // reasons being typed, kept across re-renders
let DB = null, CAN_DECIDE = false, DB_STATE = "loading";
const decKey = (nodo, id) => `${nodo}--${id}`;
function decisionOf(nodo, item) {
  return DEC[decKey(nodo, item.id)] || (item.decisione ? {decisione: item.decisione.decisione, motivo: item.decisione.motivo, quando: item.decisione.quando, registrata: true} : null);
}
function decideBox(nodo, item, tipo) {
  const d = decisionOf(nodo, item);
  const k = decKey(nodo, item.id);
  const off = !CAN_DECIDE ? "disabled" : "";
  const note = DB_STATE === "absent" ? "Le decisioni si registrano aprendo l'esploratore su claude.ai." : DB_STATE === "loading" ? "Collegamento al registro delle decisioni…" : !CAN_DECIDE ? "Solo chi modifica l'esploratore registra le decisioni." : "";
  const head = `<div class="decide" data-k="${esc(k)}" data-nodo="${esc(nodo)}" data-id="${esc(item.id)}" data-tipo="${esc(tipo)}">`;
  const corr = d?.correzioni ? [d.correzioni.catena ? "nella catena " + d.correzioni.catena : "", d.correzioni.dopo != null ? (d.correzioni.dopo === "end" ? "in fondo" : "dopo l'anello " + d.correzioni.dopo) : "", d.correzioni.afferma ? "con il testo: «" + d.correzioni.afferma + "»" : ""].filter(Boolean).join(", ") : "";
  const corrLine = corr ? `<div class="muted" style="font-size:13px">Correzione: ${esc(corr)}</div>` : "";
  if (d && d.da === "claude" && d.stato === "da confermare") {
    return `${head}<div class="btns"><span class="pill decided-${esc(d.decisione)}">Claude: ${esc(d.decisione)}</span><span class="muted" style="font-size:13px">${esc(d.motivo || "")}</span></div>${corrLine}
      <textarea aria-label="Motivo per ribaltare" placeholder="Per ribaltare: il tuo motivo" ${off}>${esc(DRAFT[k] || "")}</textarea>
      <div class="btns"><button type="button" data-act="conferma" ${off}>Conferma</button><button type="button" data-act="ribalta" ${off}>Ribalta</button>${note ? `<span class="muted" style="font-size:13px">${esc(note)}</span>` : ""}</div></div>`;
  }
  const who = d?.stato === "confermata" ? " · di Claude, confermata" : d?.stato === "ribaltata" ? " · ribaltata (Claude: " + (d.motivo_claude || "") + ")" : "";
  const state = d ? `<span class="pill decided-${esc(d.decisione)}">${esc(d.decisione)}</span><span class="muted" style="font-size:13px">${esc(d.motivo || "")}${esc(who)}${d.quando ? " · " + esc(d.quando.slice(0, 10)) : ""}${d.registrata ? " · registrata nel nodo" : ""}</span>` : "";
  if (d?.registrata && !DEC[k]) return `<div class="decide"><div class="btns">${state}</div></div>`;
  return `${head}
    ${d ? `<div class="btns">${state}${CAN_DECIDE ? `<button type="button" data-act="annulla">Annulla</button>` : ""}</div>${corrLine}` : `
    <textarea aria-label="Motivo della decisione" placeholder="Motivo (obbligatorio)" ${off}>${esc(DRAFT[k] || "")}</textarea>
    <div class="btns"><button type="button" data-act="accettata" ${off}>Accetta</button><button type="button" data-act="rifiutata" ${off}>Rifiuta</button>
      ${note ? `<span class="muted" style="font-size:13px">${esc(note)}</span>` : ""}</div>`}</div>`;
}
function pendingCount(n) {
  const items = [...(n.proposte || []), ...(n.novita || [])];
  return items.filter(x => { const d = decisionOf(n.id, x); return !d || d.stato === "da confermare"; }).length;
}
async function startDecisions() {
  try {
    const timer = setTimeout(() => { if (DB_STATE === "loading") { DB_STATE = "absent"; rerenderKeep(); } }, 10000);
    for (let i = 0; i < 40 && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 250));
    if (!window.claude?.use) { clearTimeout(timer); DB_STATE = "absent"; rerenderKeep(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) { clearTimeout(timer); DB_STATE = "absent"; rerenderKeep(); return; }
    DB = db;
    let w = null, edit = false;
    try { w = user ? await user.can("data.write") : null; edit = user ? await user.canEdit() : false; } catch (e) {}
    CAN_DECIDE = edit === true || w === true || (w == null && !user);
    db.collection("decisioni").onSnapshot(snap => {
      clearTimeout(timer);
      DB_STATE = "ok";
      for (const k of Object.keys(DEC)) delete DEC[k];
      snap.docs.forEach(d => { DEC[d.id] = d.data(); });
      rerenderKeep();
    }, () => { clearTimeout(timer); DB_STATE = "absent"; rerenderKeep(); });
  } catch (e) { DB_STATE = "absent"; rerenderKeep(); }
}
function rerenderKeep() {
  buildIndex();
  const h = location.hash.slice(1);
  if (!h.startsWith("n-")) { document.querySelectorAll("#index a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + (h || "cantiere"))); return; }
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}
async function onDecide(box, act) {
  const k = box.dataset.k, cur = DEC[k];
  const write = async data => {
    box.querySelectorAll("button, textarea").forEach(x => x.disabled = true);
    try { await DB.doc("decisioni/" + k).set(data); delete DRAFT[k]; }
    catch (e) {
      if (e.code === "invalid_argument") CAN_DECIDE = false;
      box.querySelectorAll("button, textarea").forEach(x => x.disabled = false);
      alertBox(box, "Non salvata: " + (e.code === "invalid_argument" ? "non hai il permesso di registrare decisioni" : (e.code || "errore")));
    }
  };
  const now = new Date().toISOString();
  const motivo = (box.querySelector("textarea")?.value || "").trim();
  if (act === "annulla") {
    if (cur?.da === "claude" || cur?.motivo_claude) {  // back to Claude's provisional decision
      const back = {...cur, stato: "da confermare", da: "claude"};
      if (cur.stato === "ribaltata") Object.assign(back, {decisione: cur.decisione === "accettata" ? "rifiutata" : "accettata", motivo: cur.motivo_claude, quando: cur.quando_claude || cur.quando});
      delete back.motivo_claude; delete back.quando_claude; delete back.confermata_quando;
      return write(back);
    }
    try { await DB.doc("decisioni/" + k).delete(); } catch (e) { alertBox(box, "Non salvata: " + (e.code || "errore")); }
    return;
  }
  if (act === "conferma") return write({...cur, stato: "confermata", confermata_quando: now});
  if (act === "ribalta") {
    if (!motivo) { alertBox(box, "Scrivi il motivo per ribaltare la decisione di Claude."); return; }
    return write({...cur, decisione: cur.decisione === "accettata" ? "rifiutata" : "accettata", motivo, motivo_claude: cur.motivo, quando_claude: cur.quando, quando: now, da: "redazione", stato: "ribaltata"});
  }
  if (!motivo) { alertBox(box, "Scrivi il motivo: la decisione si registra con il suo perché."); return; }
  return write({nodo: box.dataset.nodo, id: box.dataset.id, tipo: box.dataset.tipo, decisione: act, motivo, quando: now, da: "redazione"});
}
function alertBox(box, msg) {
  let m = box.querySelector(".msg");
  if (!m) { m = document.createElement("span"); m.className = "msg muted"; m.style.fontSize = "13px"; box.querySelector(".btns").appendChild(m); }
  m.textContent = msg;
}
function proposalsSection(n) {
  if (!n.proposte?.length) return "";
  const byChain = {};
  n.proposte.forEach(p => (byChain[p.catena] ||= []).push(p));
  const open = pendingCount(n);
  return `<section><div class="row"><h2>Proposte da decidere</h2><span class="num muted">${open} aperte su ${n.proposte.length}</span></div>
    <p class="muted" style="margin:0;max-width:72ch">Anelli proposti dalla pipeline per le catene del nodo, con la citazione ritrovata dal codice. Ogni decisione si registra con il motivo; quelle accettate entrano nel nodo. Le decisioni proposte da Claude si confermano o si ribaltano con il proprio motivo.</p>
    ${Object.entries(byChain).map(([cid, ps]) => `<details class="panel" ${ps.some(p => !decisionOf(n.id, p)) ? "open" : ""}><summary>${esc(ps[0].titolo_catena)} <span class="num muted">(${ps.length})</span></summary>
      ${ps.map(p => `<div class="card" style="margin-top:10px">
        <div class="row"><strong>${srcShort(p.pezzo)}</strong>${p.relazione ? relChip(p.relazione.tipo, p.relazione.verbo) : ""}<span class="muted num">${p.dopo === "end" ? "in fondo alla catena" : "dopo l'anello " + esc(p.dopo)}</span>${p.punteggio != null ? `<span class="muted num">giudizio ${esc(p.punteggio)}</span>` : ""}</div>
        <div>${esc(p.afferma)}</div>${p.citazione ? quote(p.citazione.testo, p.citazione.it) : ""}
        ${p.relazione?.nota ? `<div class="muted" style="font-size:13px">${esc(p.relazione.nota)}</div>` : ""}
        ${p.nuovo ? `<div style="font-size:14px"><span class="label">Che cosa aggiunge</span> ${esc(p.nuovo)}</div>` : ""}
        ${decideBox(n.id, p, "proposta")}</div>`).join("")}</details>`).join("")}</section>`;
}

function pill(stato) {
  const s = stato || "bozza";
  return `<span class="pill st-${esc(s.replace(/ /g, "-"))}">${esc(s)}</span>`;
}
function relChip(tipo, verbo) {
  if (!tipo && !verbo) return "";
  const cls = tipo ? "rel-" + tipo.split(" ")[0] : "";
  return `<span class="chip ${cls}">${esc(verbo ? verbo + (tipo ? " · " + tipo : "") : tipo)}</span>`;
}
function site(c) {
  if (!c) return "";
  const b = c.costruito || {};
  return `<div class="site">
    <div class="row">${pill(c.stato)}<span class="muted">${esc(b.come || "")}${b.data ? " · " + esc(b.data) : ""}${b.modello ? " · " + esc(b.modello) : ""}</span>
      <span class="num muted">costo ${money(c.costo_usd)}</span></div>
    ${c.verifiche?.length ? `<div><span class="label">Verifiche</span><ul>${c.verifiche.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}
    ${c.da_fare?.length ? `<div><span class="label">Da fare</span><ul>${c.da_fare.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}
  </div>`;
}
function quote(q, it) {
  if (!q) return "";
  return `<blockquote>«${esc(q)}»${it ? `<span class="it">${esc(it)}</span>` : ""}</blockquote>`;
}
function srcLine(pid, extra = "") {
  const p = D.pezzi[pid] || {};
  const n = D.note[pid];
  const meta = [p.testata, p.data, LANG[p.lingua] || p.lingua, n?.tipo && KIND[n.tipo], p.tipo_fonte && !n ? p.tipo_fonte : null,
    p.testo_parziale ? "testo parziale" : null, p.simulato ? "contributo simulato" : null, p.via ? "via " + p.via : null].filter(Boolean);
  const title = p.titolo || (n ? "" : p.testata);
  return `<div class="src">
    <div class="meta">${meta.map(esc).join(" · ")}</div>
    ${title ? `<div class="title">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title)}</div>` : (p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\//, "").slice(0, 70))}</a>` : "")}
    ${n?.sintesi ? `<div>${esc(n.sintesi)}</div>` : ""}
    ${n ? quote(n.citazione, n.citazione_it) : ""}
    ${extra}
  </div>`;
}
function cite(pid) {
  // one line per source under the card's common synthesis: outlet, date, language, original title
  const p = D.pezzi[pid] || {};
  const t = p.titolo ? (p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.titolo)}</a>` : esc(p.titolo)) : srcShort(pid);
  const meta = [p.testata, p.data, LANG[p.lingua] || p.lingua, p.testo_parziale ? "testo parziale" : null].filter(Boolean).map(esc).join(" · ");
  return `<div class="cite"><span class="meta">${meta}</span><span>${t}</span></div>`;
}
function srcShort(pid) {
  const p = D.pezzi[pid] || {};
  const lbl = esc(p.testata || "fonte") + (p.data ? ` <span class="num muted">${esc(p.data)}</span>` : "");
  return p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${lbl}</a>` : lbl;
}

function viewNode(id) {

function nodePositions(n) {
  const sec = {acquisito: "Acquisito", conteso: "Conteso", "in attesa": "In attesa"};

  return `${n.attacco ? `<div class="panel"><div>${esc(n.attacco)}</div>${n.nodo_cruciale ? `<div style="margin-top:8px"><span class="label">Il punto su cui si divide</span><div>${esc(n.nodo_cruciale)}</div></div>` : ""}</div>` : ""}`
    + rootText(n.testo, x => `<div><span class="label">${esc(sec[x.sezione] || x.sezione)}</span><div>${esc(x.t)}</div><div class="row muted" style="font-size:13px;margin-top:4px">${x.fonti.map(srcShort).join(" · ")}</div></div>`)
    + `<section><h2>Posizioni</h2><div class="bands">${n.posizioni.map(b => `<div class="band"><h3>${esc(b.nome)}</h3><div class="muted" style="font-size:13px">${esc(b.nota)}</div>
      ${n.contributi.filter(c => c.posizione === b.id).map(c => `<div class="card"><div class="row"><strong>${srcShort(c.pezzo)}</strong><span class="chip ${c.tipo === "Contributo simulato" ? "rel-simulata" : ""}">${esc(c.tipo)}</span></div>
        <div style="font-size:14px">${esc(c.afferma)}</div>${quote(c.citazione, c.citazione_it)}${rels(c.id)}</div>`).join("") || `<div class="empty">Nessun contributo</div>`}</div>`).join("")}</div></section>`;
}
function nodeClaim(n) {
  const a = n.affermazione;
  const prem = Object.fromEntries(n.premesse.map(p => [p.id, p]));
  return `<div class="panel"><span class="label">L'affermazione · ${esc(a.autore)}, ${esc(a.data)}</span>
      ${quote(a.originale, a.originale_it)}<div class="muted" style="font-size:13px;margin-top:8px">${esc(a.diffusione || "")} · <a href="${esc(a.url)}" target="_blank" rel="noopener">post originale</a></div>
      ${n.chi?.length ? `<div style="margin-top:10px"><span class="label">Chi la diffonde</span>${n.chi.map(x => `<div>${esc(x.t)} <span class="muted">(${srcShort(x.fonte)})</span></div>`).join("")}</div>` : ""}</div>`
    + rootText(n.testo, x => `<div><div>${esc(x.t)}</div><div class="row muted" style="font-size:13px;margin-top:4px">${(x.premesse || []).map(p => esc(prem[p]?.etichetta || p)).join(" · ")}</div></div>`)
    + `<section><h2>Premesse</h2>${n.premesse.map(p => `<div class="panel" style="display:grid;gap:8px">
        <div class="row"><h3>${esc(p.etichetta)}</h3><span class="chip">${esc(p.stato)}</span></div><div>${esc(p.esito)}</div>
        ${p.evidenze.map(e => `<div><div class="muted" style="font-size:13px">${srcShort(e.pezzo)}${e.nota ? " · " + esc(e.nota) : ""}</div>${quote(e.citazione, e.citazione_it)}</div>`).join("")}</div>`).join("")}</section>`
    + (n.catene?.length ? `<section><h2>Dibattito collegato</h2>${n.catene.map(c => `<div class="panel" style="display:grid;gap:10px"><div class="row"><h3>${esc(c.titolo)}</h3><span class="chip">${esc(c.stato)}</span><span class="muted">${esc(c.dove || "")}</span></div>
        <div class="chain">${c.anelli.map(x => `<div class="ring"><div class="dot"></div><div><div class="row"><strong>${esc(x.chi)}</strong>${x.relazione ? relChip(x.relazione.tipo) : ""}${x.pezzo ? `<span class="muted">${srcShort(x.pezzo)}</span>` : ""}</div>
          <div>${esc(x.afferma)}</div>${x.citazione ? quote(x.citazione.testo, x.citazione.it) : ""}</div></div>`).join("")}</div></div>`).join("")}</section>` : "")
    + (n.collegati?.length ? `<section><h2>Nodi della mappa toccati</h2><div class="panel">${n.collegati.map(x => `<div class="row"><strong>${esc(x.t)}</strong><span class="muted">${esc(x.rel)}</span></div>`).join("")}</div></section>` : "");
}

let voiceFilter = "tutte";
function viewVoices() {
  const subs = ["tutte", ...new Set(D.voci.flatMap(v => v.sottotopic))];
  const list = D.voci.filter(v => voiceFilter === "tutte" || v.sottotopic.includes(voiceFilter));
  const ch = c => c.kind === "search" ? `<span class="chip">ricerca per domanda</span>`
    : c.kind === "social" ? `<span class="chip">${esc(c.handle)}</span>`
    : `<span class="chip rel-dichiarata">${esc(c.kind === "source" ? "già nel bacino" : c.kind)}${c.source_id ? " · " + esc(c.source_id) : ""}</span>`;
  return `<div><div class="crumb">Registro delle voci · Intelligenza artificiale</div><h1>${D.voci.length} voci</h1>
    <p class="lead">Persone approvate dalla redazione, ciascuna con i canali da cui la raccogliamo. La qualità si decide sulla persona, non sul singolo testo.</p></div>
    <div class="tabs" role="group" aria-label="Filtro per area">${subs.map(s => `<button type="button" data-voice="${esc(s)}" aria-pressed="${s === voiceFilter}">${esc(s)}</button>`).join("")}</div>
    <div class="table-wrap"><table><thead><tr><th>Voce</th><th>Ruolo</th><th>Posizione</th><th>Canali</th></tr></thead><tbody>
    ${list.map(v => `<tr><td><a href="${esc(v.homepage)}" target="_blank" rel="noopener">${esc(v.nome)}</a> <span class="muted num">${esc(LANG[v.lingua] || v.lingua)}</span></td>
      <td>${esc(v.ruolo)}</td><td class="muted">${esc(v.posizione)}</td><td><div class="row" style="gap:4px">${v.canali.map(ch).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>`;
}
function notFound() { return `<h1>Pagina non trovata</h1><p><a href="#cantiere">Torna al cantiere</a></p>`; }

function render() {
  const h = location.hash.slice(1) || "cantiere";
  let html;
  if (h === "cantiere") html = viewCantiere();
  else if (h === "topic-ia") html = viewTopicIA();
  else if (h === "topic-euromaidan") html = viewTopicEM();
  else if (h === "voci") html = viewVoices();
  else if (h.startsWith("m-")) html = viewMatrix(h.slice(2));
  else if (h.startsWith("n-")) html = viewNode(h.slice(2));
  else html = notFound();
  $("#view").innerHTML = html;
  document.querySelectorAll("#index a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + h));
}
document.addEventListener("input", e => {
  const box = e.target.closest(".decide");
  if (box && e.target.tagName === "TEXTAREA") DRAFT[box.dataset.k] = e.target.value;
});
document.addEventListener("click", e => {
  const d = e.target.closest(".decide button[data-act]");
  if (d) { if (DB && CAN_DECIDE) onDecide(d.closest(".decide"), d.dataset.act); return; }
  const b = e.target.closest("button[data-sub], button[data-voice]");
  if (!b) return;
  if (b.dataset.sub) currentSub = b.dataset.sub; else voiceFilter = b.dataset.voice;
  render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
buildIndex();
render();
startDecisions();
</script>
